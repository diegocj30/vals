[package]
name = "vals-core"
description = "Simulacion determinista de VALS. Sin dependencias graficas, a proposito."
version.workspace = true
edition.workspace = true

# Sin esto, `cargo bench` intenta lanzar tambien el harness de libtest del lib
# y se atraganta con los argumentos de criterion.
[lib]
bench = false

[dependencies]
glam = { version = "0.33", features = ["serde"] }
ron = "0.12.2"
serde = { version = "1.0.229", features = ["derive"] }

[dev-dependencies]
criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "sim"
harness = false
