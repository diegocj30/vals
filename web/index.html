<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
  <title>VALS</title>
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #08080e; }
    canvas { display: block; width: 100%; height: 100%; outline: none; }
  </style>
</head>
<body>
  <!-- macroquad exige exactamente este id. -->
  <canvas id="glcanvas" tabindex="1"></canvas>

  <!--
    mq_js_bundle.js corre en "use strict" y dentro asigna `register_plugin`
    sin declararlo, lo que en modo estricto lanza ReferenceError y aborta el
    resto del bundle. Declarar el global antes lo desactiva.
  -->
  <script>var register_plugin;</script>
  <script src="mq_js_bundle.js"></script>
  <script>
    // El mando en web.
    //
    // macroquad no trae mandos, asi que lo pone aqui la Gamepad API del
    // navegador y se pasa a Rust por el mecanismo de plugins de miniquad, el
    // mismo que usa el audio. Sin wasm-bindgen, que es justo lo que no se
    // quiso arrastrar al elegir macroquad.
    //
    // Se pasan los botones **crudos**, en el orden del "standard gamepad"
    // (el bit i es `buttons[i]`), y el stick sumado a la cruceta. Que hace
    // cada boton se decide en Rust, que es donde se pueden cambiar: asi
    // rebindear el mando funciona igual aqui que en nativo.
    //
    // Los numeros estan repetidos a mano: en `crates/vals-app/src/mando.rs`
    // hay un test que se pone rojo si alguien los mueve, porque si no el fallo
    // seria silencioso y solo aqui.
    (function () {
      var BOTONES = 17;
      var ARRIBA = 1 << 12, ABAJO = 1 << 13, IZQUIERDA = 1 << 14, DERECHA = 1 << 15;
      var CONECTADO = 1 << 20, PLAYSTATION = 1 << 21;
      var ZONA_MUERTA = 0.45;

      function pulsado(pad, i) {
        var b = pad.buttons[i];
        return b !== undefined && (b.pressed || b.value > 0.5);
      }

      function leer() {
        var pads = navigator.getGamepads ? navigator.getGamepads() : [];
        for (var i = 0; i < pads.length; i++) {
          var p = pads[i];
          if (!p || !p.connected) continue;

          var bits = CONECTADO;
          // Solo para poner los nombres correctos en pantalla.
          if (/playstation|dualshock|dualsense|sony|wireless controller/i.test(p.id || "")) {
            bits |= PLAYSTATION;
          }
          for (var b = 0; b < BOTONES; b++) {
            if (pulsado(p, b)) bits |= 1 << b;
          }
          // Ojo con el signo: en la Gamepad API el eje Y crece hacia ABAJO,
          // al reves que en gilrs. Es el tipo de detalle que sale de probarlo
          // y no de leerlo.
          var ax = p.axes[0] || 0, ay = p.axes[1] || 0;
          if (ay < -ZONA_MUERTA) bits |= ARRIBA;
          if (ay > ZONA_MUERTA) bits |= ABAJO;
          if (ax < -ZONA_MUERTA) bits |= IZQUIERDA;
          if (ax > ZONA_MUERTA) bits |= DERECHA;
          return bits;
        }
        return 0;
      }

      miniquad_add_plugin({
        register_plugin: function (importObject) {
          importObject.env.vals_mando = leer;
        },
        version: 1,
        name: "vals_mando",
      });
    })();

    // El progreso, en localStorage.
    //
    // Mismo mecanismo: dos funciones que Rust declara en un extern "C". Lo
    // unico del bundle de lo que dependen es `wasm_memory`, que es global
    // desde que carga el .wasm; las cadenas se codifican aqui con TextEncoder
    // en vez de tirar de las utilidades internas del bundle.
    (function () {
      var CLAVE = "vals.progreso";

      function guardar(ptr, len) {
        try {
          var bytes = new Uint8Array(wasm_memory.buffer, ptr, len);
          localStorage.setItem(CLAVE, new TextDecoder().decode(bytes));
        } catch (e) {
          // Modo privado, cuota llena, cookies bloqueadas. Se juega igual.
          console.warn("no se pudo guardar el progreso:", e);
        }
      }

      function cargar(ptr, cap) {
        try {
          var texto = localStorage.getItem(CLAVE);
          if (texto === null) return -1;
          var bytes = new TextEncoder().encode(texto);
          if (bytes.length > cap) return -1;
          new Uint8Array(wasm_memory.buffer, ptr, cap).set(bytes);
          return bytes.length;
        } catch (e) {
          return -1;
        }
      }

      miniquad_add_plugin({
        register_plugin: function (importObject) {
          importObject.env.vals_guardar = guardar;
          importObject.env.vals_cargar = cargar;
        },
        version: 1,
        name: "vals_guardado",
      });
    })();

    // Ojo: el bundle ya declara un `canvas` global con `const`. Redeclararlo
    // aqui seria un SyntaxError que se cargaria todo este script.
    var glcanvas = document.getElementById("glcanvas");
    glcanvas.focus();
    glcanvas.addEventListener("click", function () { glcanvas.focus(); });
    load("vals.wasm");
  </script>
</body>
</html>
