name: Pages

# Publica el build web en GitHub Pages en cada push a main. Es lo mismo que
# hace scripts/build-web.ps1, pero en Linux: compilar a wasm y dejar en web/
# el .wasm junto al index.html y el bundle de macroquad, que ya estan
# versionados.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Un solo despliegue a la vez; si llega otro push, el viejo sobra.
concurrency:
  group: pages
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  deploy:
    # Pages no existe para repos privados en el plan gratuito: mientras el repo
    # sea privado el job se salta en vez de fallar en cada push.
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2

      # En wasm no hace falta ninguna libreria de sistema: ni ALSA ni X11 ni
      # libudev, que son del build nativo.
      - name: Build web
        run: |
          cargo build -p vals-app --target wasm32-unknown-unknown --release
          cp target/wasm32-unknown-unknown/release/vals-app.wasm web/vals.wasm

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web

      - id: deploy
        uses: actions/deploy-pages@v4
