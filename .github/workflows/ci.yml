name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2

      # macroquad necesita estas libs para enlazar en Linux.
      - name: Dependencias de sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libx11-dev libxi-dev libgl1-mesa-dev

      - name: Formato
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Tests
        run: cargo test --all

      # El replay dorado: reproduce 30 s de partida grabada y comprueba que
      # el mundo pasa por las mismas huellas. Si esto falla, la jugabilidad ha
      # cambiado. Ya lo cubre `cargo test`, pero como paso propio el fallo se
      # lee de un vistazo en el log en vez de estar enterrado entre 129 tests.
      - name: Replay dorado
        run: cargo run -p vals-core --example replay_tool -- verify assets/replays/golden.valsrpl

      # El build web se comprueba en cada push a proposito: si solo se mirase
      # al final del proyecto, llevaria meses roto sin que nadie lo supiera.
      - name: Build web
        run: cargo build -p vals-app --target wasm32-unknown-unknown --release
